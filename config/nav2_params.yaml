amcl:
  ros__parameters:
    transform_tolerance: 0.8
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom_frame
    global_frame_id: map
    scan_topic: /scan_downsampled
    laser_max_range: 8.0
    laser_min_range: 0.12
    max_beams: 60
    initial_pose_x: 0.08
    initial_pose_y: 0.05
    initial_pose_a: 0.785
    set_initial_pose: true

bt_navigator:
  ros__parameters:
    transform_tolerance: 0.8
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    transform_tolerance: 0.8
    global_frame: odom_frame
    robot_base_frame: base_footprint
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    controller_frequency: 10.0
    # FIX S-2: required by Nav2 Jazzy controller_server
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.5
      stateful: true
    FollowPath:
      transform_tolerance: 0.8
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.20
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.60
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      max_allowed_time_to_collision_up_to_carrot: 1.0
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 3.2
      use_cost_regulated_linear_velocity_scaling: false

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.8
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom_frame
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.11
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.15
        cost_scaling_factor: 3.5
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_downsampled
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 7.5
          obstacle_min_range: 0.12

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.8
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.11
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_downsampled
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 7.5
          obstacle_min_range: 0.12
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.15
        cost_scaling_factor: 3.5

planner_server:
  ros__parameters:
    transform_tolerance: 0.8
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    transform_tolerance: 0.8
    robot_base_frame: base_footprint
    transform_timeout: 0.8
    global_frame: odom_frame
    local_frame: odom_frame
    simulate_ahead_time: 2.0
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
      global_frame: odom_frame
      robot_base_frame: base_footprint
    backup:
      plugin: nav2_behaviors/BackUp
      global_frame: odom_frame
      robot_base_frame: base_footprint
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
      global_frame: odom_frame
      robot_base_frame: base_footprint
    wait:
      plugin: nav2_behaviors/Wait
      global_frame: odom_frame
      robot_base_frame: base_footprint

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.8
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    attempt_reconnect_timeout: 2.0
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
